<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ATOM POS">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
<title>ATOM Accountant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/common.css">
<style>
.body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center}
.badge{display:inline-block;background:#fef3c7;color:#b45309;font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;margin-bottom:16px}
.body h3{font-size:20px;font-weight:800;letter-spacing:-.03em;margin-bottom:10px}
.body p{font-size:14px;color:var(--m);line-height:1.55;max-width:280px;font-weight:500}
.body a{display:inline-block;margin-top:24px;padding:12px 20px;background:var(--p);color:#fff;border-radius:12px;font-weight:700;font-size:14px;text-decoration:none}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <img class="logo" src="/static/logo.png" alt="ATOM">
  <div class="top-r"><button class="ib" id="btnMenu" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></button></div>
</header>
<div class="ov" id="ov"></div>
<aside class="dr" id="dr"><div class="dh"><h1>ATOM POS</h1><p>Accountant panel</p></div><div class="db" id="drawerBody"></div></aside>
<div class="col">
  <div class="vhead"><h2>Accountant</h2><p>Reports &amp; ledgers</p></div>
  <div class="body">
    <span class="badge">PAUSED</span>
    <h3>Coming soon</h3>
    <p>Accountant mode is paused for now. Reports, GST summaries and ledger exports will appear here in a future update.</p>
    <a href="/billing">Back to Billing</a>
  </div>
</div>
</div>
<script src="/static/common.js"></script>
<script>$('#drawerBody').innerHTML=panelLinks('accountant');initShell();</script>
</body>
</html>
