<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
<link rel="stylesheet" href="/static/common.css">
<title>ATOM Accountant</title>
<style>
body.acc-home .app,.acc-home .col,.acc-home .rep{background:#000!important}
.acc-home .vhead{display:none!important}
.acc-home .top{background:transparent!important;border:0!important;box-shadow:none!important}
.acc-home .top .logo{display:none!important}
.acc-home .top .ib{color:#fff!important;border-color:rgba(255,255,255,.25)!important}
.rep{padding:0 16px 28px}.card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.card h3{font-size:13px;font-weight:800;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:13px;border-bottom:1px solid #f1f5f9}
.row:last-child{border:0}.row b{font-weight:700;white-space:nowrap}
.tot{font-weight:800;color:var(--p)}.muted{color:var(--m);font-size:12px;margin:0 0 12px;font-weight:500}
.tbl{width:100%;border-collapse:collapse;font-size:12px}.tbl th,.tbl td{text-align:left;padding:8px 6px;border-bottom:1px solid #f1f5f9}
.tbl th{color:var(--m);font-weight:600}.tbl td.r,.tbl th.r{text-align:right}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <img class="logo" src="/static/logo.png" alt="ATOM">
  <div class="top-r"><button class="ib" id="btnMenu" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></button></div>
</header>
<div class="ov" id="ov"></div>
<aside class="dr" id="dr"><div class="dh"><div class="dh-text"><h1>ATOM POS</h1><p>Advance Transactions &amp; Operations Management</p></div><img class="dh-logo" src="/static/logo-white.png" alt="ATOM"></div><div class="db" id="drawerBody"></div></aside>
<div class="col">
  <div class="vhead"><h2 id="accTitle">Accountant</h2><p id="accSub">Welcome</p></div>
  <div class="rep" id="rep"></div>
</div>
</div>
<script src="/static/common.js"></script>
<script>
document.addEventListener('contextmenu',e=>e.preventDefault());
logSession('Accountant');
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const chev='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="6 9 12 15 18 9"/></svg>';
$('#drawerBody').innerHTML=panelLinks('accountant')+
  '<button type="button" class="adm-drop" data-g="finrep">Financial reports'+chev+'</button>'+
  '<div class="adm-sub" id="sub-finrep"><button type="button" data-r="trading">Trading account</button><button type="button" data-r="pl">P&amp;L account</button><button type="button" data-r="sopl">Statement of P&amp;L</button><button type="button" data-r="bs">Balance sheet</button></div>'+
  '<button type="button" class="adm-drop" data-g="books">Books of accounts'+chev+'</button>'+
  '<div class="adm-sub" id="sub-books"><button type="button" data-r="pb">Purchase book</button><button type="button" data-r="sb">Sales book</button><button type="button" data-r="prb">Purchase return book</button><button type="button" data-r="srb">Sales return book</button><button type="button" data-r="ledger">Ledger</button></div>';
initShell();

const titles={home:['Accountant','Welcome'],trading:['Trading account','Gross'],pl:['P&L account','Net'],sopl:['Statement of P&L','Full'],bs:['Balance sheet','Position'],pb:['Purchase book','Purchases'],sb:['Sales book','Sales'],prb:['Purchase return book','Returns'],srb:['Sales return book','Returns'],ledger:['Ledger','Accounts']};
const indDate=d=>{if(!d)return '—';try{return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'2-digit',year:'numeric'})}catch(e){return String(d).slice(0,10)}};
const invNo=t=>{const m=String(t.subtitle||t.note||'').match(/#?\d{3,}/);return m?m[0].replace('#',''):(t.id?String(t.id).slice(-6):'—')};
const emptyRow=n=>'<tr><td colspan="'+n+'" style="text-align:center;color:var(--m);padding:18px">No entries yet</td></tr>';
const rows=p=>p.map(([k,v])=>'<div class="row"><span>'+k+'</span><b>'+fmt(v)+'</b></div>').join('');
const tbl=(h,b)=>'<div style="overflow-x:auto"><table class="tbl"><thead><tr>'+h.map((x,i)=>'<th'+(i?' class="r"':'')+'>'+x+'</th>').join('')+'</tr></thead><tbody>'+b+'</tbody></table></div>';
const isRet=t=>{const bk=t.book||'',ti=t.title||'',st=t.status||'';return st==='return'||bk==='sales_return'||bk==='purchase_return'||/^sales return/i.test(ti)||/^purchase return/i.test(ti)};
const isPurRet=t=>(t.book==='purchase_return')||/^purchase return/i.test(t.title||'');
const isSaleRet=t=>isRet(t)&&!isPurRet(t);

async function loadData(){
  await openDB();
  let txs=[],purch=[],fin=[],prods=[];
  try{txs=await all('transactions')||[]}catch(e){}
  try{purch=await all('purchases')||[]}catch(e){}
  try{fin=await all('finance')||[]}catch(e){}
  try{prods=await all('products')||[]}catch(e){}
  txs=txs.map(t=>({...t,amount:Math.abs(+t.amount||0),date:t.date||t.at||''}));
  purch=purch.map(p=>({...p,total:Math.abs(+p.total||((+p.cost||0)*(+p.qty||0))),at:p.at||p.date||''}));
  fin=fin.map(f=>({...f,amount:Math.abs(+f.amount||0),at:f.at||f.date||'',direction:(f.direction==='in'||f.dir==='in')?'in':'out',category:f.category||f.source||f.type||'other'}));
  const sales=txs.filter(t=>!isRet(t)).reduce((s,t)=>s+t.amount,0);
  const unpaid=txs.filter(t=>(t.status||'')==='unpaid').reduce((s,t)=>s+t.amount,0);
  const returns=txs.filter(isRet).reduce((s,t)=>s+t.amount,0);
  const cogs=purch.reduce((s,p)=>s+p.total,0);
  const finIn=fin.filter(f=>f.direction==='in').reduce((s,f)=>s+f.amount,0);
  const finOut=fin.filter(f=>f.direction==='out').reduce((s,f)=>s+f.amount,0);
  const drawings=fin.filter(f=>f.category==='drawings').reduce((s,f)=>s+f.amount,0);
  const opEx=fin.filter(f=>f.direction==='out'&&['operating','salary','rent','utilities','transport','other_exp'].includes(f.category)).reduce((s,f)=>s+f.amount,0);
  const otherInc=fin.filter(f=>f.direction==='in'&&f.category!=='sales').reduce((s,f)=>s+f.amount,0);
  const capital=fin.filter(f=>f.category==='capital').reduce((s,f)=>s+f.amount,0);
  const inv=prods.reduce((s,p)=>s+(+p.stock||0)*(+p.cost||0),0);
  const payables=purch.filter(p=>/order|pending/i.test(p.status||'')).reduce((s,p)=>s+p.total,0);
  const paidSales=txs.filter(t=>!isRet(t)&&(t.status||'')!=='unpaid').reduce((s,t)=>s+t.amount,0);
  const gross=sales-returns-cogs,net=gross+otherInc-opEx-Math.max(0,finOut-drawings-opEx);
  const cash=Math.max(0,paidSales+finIn-finOut);
  return{txs,purch,fin,sales,paidSales,unpaid,returns,cogs,opEx,drawings,finIn,finOut,capital,otherInc,inv,payables,gross,net,cash};
}

async function show(r){
  r=r||'home';
  const t=titles[r]||['Report',''];
  if($('#accTitle'))$('#accTitle').textContent=t[0];
  if($('#accSub'))$('#accSub').textContent=t[1]||'';
  const el=$('#rep');if(!el)return;
  try{closeShell()}catch(e){}
  document.body.classList.toggle('acc-home',r==='home');
  if(r==='home'){
    el.innerHTML='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;background:#000">'+
      '<img src="/static/logo-white.png" alt="ATOM" style="width:120px;height:120px;object-fit:contain"></div>';
    return;
  }
  let d;
  try{d=await loadData()}catch(e){el.innerHTML='<div class="card"><p class="muted">Could not load data</p></div>';return}
  if(r==='trading') el.innerHTML='<div class="card"><h3>Trading account</h3>'+rows([['Sales',d.sales],['Less: Returns',d.returns],['Net sales',d.sales-d.returns],['Purchases',d.cogs]])+'<div class="row tot"><span>Gross profit/(loss)</span><b>'+fmt(d.gross)+'</b></div></div>';
  else if(r==='pl') el.innerHTML='<div class="card"><h3>P&amp;L account</h3>'+rows([['Gross profit',d.gross],['Other income',d.otherInc],['Operating expenses',d.opEx],['Other expenses',Math.max(0,d.finOut-d.drawings-d.opEx)]])+'<div class="row tot"><span>Net profit/(loss)</span><b>'+fmt(d.net)+'</b></div></div>';
  else if(r==='sopl'){const inc=d.sales-d.returns+d.otherInc,exp=d.cogs+d.opEx+Math.max(0,d.finOut-d.drawings-d.opEx);el.innerHTML='<div class="card"><h3>Statement of P&amp;L</h3>'+rows([['Revenue',d.sales-d.returns],['Other income',d.otherInc],['Total income',inc],['Purchases',d.cogs],['Expenses',exp-d.cogs],['Total expenses',exp]])+'<div class="row tot"><span>Profit for period</span><b>'+fmt(inc-exp)+'</b></div></div>'}
  else if(r==='bs'){const eq=d.capital+d.net-d.drawings,assets=d.cash+d.inv+d.unpaid;el.innerHTML='<div class="card"><h3>Assets</h3>'+rows([['Cash &amp; bank',d.cash],['Inventory',d.inv],['Receivables',d.unpaid]])+'<div class="row tot"><span>Total assets</span><b>'+fmt(assets)+'</b></div></div><div class="card"><h3>Liabilities &amp; equity</h3>'+rows([['Payables',d.payables],['Capital (net drawings)',eq]])+'<div class="row tot"><span>Total</span><b>'+fmt(d.payables+eq)+'</b></div></div>'}
  else if(r==='sb'){
    const L=d.txs.filter(t=>!isRet(t)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    const body=L.map((t,i)=>'<tr><td>'+(i+1)+'</td><td>'+indDate(t.date)+'</td><td>'+esc(invNo(t))+'</td><td>'+esc(t.title||'Cash Sale')+'</td><td class="r">'+fmt(t.amount)+'</td><td>'+esc(t.status==='unpaid'?'Credit':(t.payMethod||'Cash'))+'</td></tr>').join('')||emptyRow(6);
    el.innerHTML='<p class="muted">'+L.length+' sale(s) from Billing</p><div class="card"><h3>Sales Book</h3>'+tbl(['S.No','Date','Invoice No','Party / Particulars','Amount (₹)','Mode'],body)+'<div class="row tot"><span>Total sales</span><b>'+fmt(L.reduce((s,t)=>s+t.amount,0))+'</b></div></div>';
  }else if(r==='pb'){
    const L=d.purch.slice().sort((a,b)=>(a.at||'').localeCompare(b.at||''));
    const body=L.map((p,i)=>'<tr><td>'+(i+1)+'</td><td>'+indDate(p.at)+'</td><td>'+esc(p.id!=null?String(p.id):'—')+'</td><td>'+esc(p.supplier||p.productName||'Purchase')+'</td><td class="r">'+fmt(p.total)+'</td><td>'+esc(p.status||'—')+'</td></tr>').join('')||emptyRow(6);
    el.innerHTML='<p class="muted">'+L.length+' purchase(s)</p><div class="card"><h3>Purchase Book</h3>'+tbl(['S.No','Date','Bill / PO No','Supplier / Particulars','Amount (₹)','Status'],body)+'<div class="row tot"><span>Total purchases</span><b>'+fmt(L.reduce((s,p)=>s+p.total,0))+'</b></div></div>';
  }else if(r==='srb'){
    const L=d.txs.filter(isSaleRet).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    const body=L.map((t,i)=>'<tr><td>'+(i+1)+'</td><td>'+indDate(t.date)+'</td><td>'+esc(invNo(t))+'</td><td>'+esc(t.title||'Sales return')+'</td><td class="r">'+fmt(t.amount)+'</td></tr>').join('')||emptyRow(5);
    el.innerHTML='<p class="muted">'+L.length+' return(s)</p><div class="card"><h3>Sales Return Book</h3>'+tbl(['S.No','Date','Ref No','Particulars','Amount (₹)'],body)+'<div class="row tot"><span>Total</span><b>'+fmt(L.reduce((s,t)=>s+t.amount,0))+'</b></div></div>';
  }else if(r==='prb'){
    const L=d.txs.filter(isPurRet).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    const body=L.map((t,i)=>'<tr><td>'+(i+1)+'</td><td>'+indDate(t.date)+'</td><td>'+esc(invNo(t))+'</td><td>'+esc(t.title||'Purchase return')+'</td><td class="r">'+fmt(t.amount)+'</td></tr>').join('')||emptyRow(5);
    el.innerHTML='<p class="muted">'+L.length+' return(s)</p><div class="card"><h3>Purchase Return Book</h3>'+tbl(['S.No','Date','Ref No','Particulars','Amount (₹)'],body)+'<div class="row tot"><span>Total</span><b>'+fmt(L.reduce((s,t)=>s+t.amount,0))+'</b></div></div>';
  }else if(r==='ledger'){
    const map={};const add=(n,dir,a,note,at)=>{n=n||'General';(map[n]=map[n]||[]).push({dir,a,note,at})};
    d.txs.forEach(t=>add(t.title||'Sales',isRet(t)?'out':'in',t.amount,t.subtitle||'',t.date));
    d.fin.forEach(f=>add(f.partyName||f.category||'Payment',f.direction,f.amount,f.note||'',f.at));
    d.purch.forEach(p=>add(p.supplier||'Purchases','out',p.total,p.productName||'',p.at));
    const keys=Object.keys(map);
    el.innerHTML='<p class="muted">'+keys.length+' account(s)</p>'+(keys.slice(0,50).map(n=>{const body=map[n].slice(0,40).map(x=>'<tr><td>'+indDate(x.at)+'</td><td>'+esc(x.note||'')+'</td><td class="r">'+(x.dir==='in'?'+':'-')+fmt(x.a)+'</td></tr>').join('')||emptyRow(3);return '<div class="card"><h3>'+esc(n)+'</h3>'+tbl(['Date','Narration','Amount'],body)+'</div>'}).join('')||'<div class="card"><p class="muted">No ledger lines</p></div>');
  }else el.innerHTML='<div class="card"><p class="muted">Unknown report</p></div>';
}

$('#drawerBody').addEventListener('click',function(e){
  const btn=e.target.closest('button[data-r]');
  if(!btn)return;
  e.preventDefault();e.stopPropagation();
  show(btn.dataset.r);
});
show('home');
</script>
</body>
</html>
