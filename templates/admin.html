<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ATOM POS">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
<title>ATOM Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/common.css">
<style>
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 24px;min-height:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat{background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--sh);border:1px solid #f1f5f9}
.stat .lbl{font-size:11px;font-weight:600;color:var(--m);text-transform:uppercase;letter-spacing:.04em}
.stat .val{font-size:22px;font-weight:800;margin-top:4px;letter-spacing:-.03em}
.stat.green .val{color:var(--g)}.stat.red .val{color:var(--r)}.stat.purple .val{color:var(--p)}
.actions{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.btn{width:100%;padding:14px 16px;border:0;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-p{background:var(--p);color:#fff}.btn-d{background:#fee2e2;color:var(--r)}
.sec-title{font-size:14px;font-weight:700;margin-bottom:10px}
.plist{display:flex;flex-direction:column;gap:8px}
.pi{background:var(--card);border-radius:12px;padding:12px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh);border:1px solid #f1f5f9}
.pi .thumb{width:48px;height:48px;border-radius:10px;background:#f1f5f9;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.pi .thumb img{width:100%;height:100%;object-fit:cover}
.pi .info{flex:1;min-width:0}.pi .name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi .meta{font-size:12px;color:var(--m);margin-top:2px}.pi .price{font-size:14px;font-weight:700;color:var(--p);flex-shrink:0}
.pi .del{width:32px;height:32px;border:0;border-radius:8px;background:#fee2e2;color:var(--r);cursor:pointer;flex-shrink:0;font-size:16px}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <img class="logo" src="/static/logo.png" alt="ATOM">
  <div class="top-r"><button class="ib" id="btnMenu" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></button></div>
</header>
<div class="ov" id="ov"></div>
<aside class="dr" id="dr"><div class="dh"><h1>ATOM POS</h1><p>Admin panel</p></div><div class="db" id="drawerBody"></div></aside>
<div class="col">
  <div class="vhead"><h2>Admin</h2><p>Catalog, stock &amp; store controls</p></div>
  <div class="scroll">
    <div class="stats">
      <div class="stat purple"><div class="lbl">Products</div><div class="val" id="sTotal">0</div></div>
      <div class="stat green"><div class="lbl">In stock</div><div class="val" id="sIn">0</div></div>
      <div class="stat red"><div class="lbl">Out of stock</div><div class="val" id="sOut">0</div></div>
      <div class="stat"><div class="lbl">Inventory value</div><div class="val" id="sVal" style="font-size:16px">₹0</div></div>
    </div>
    <div class="actions">
      <button class="btn btn-p" id="btnAdd">+ Add Product</button>
      <button class="btn btn-d" id="btnErase">Erase All Data</button>
    </div>
    <div class="sec-title">All products</div>
    <div class="plist" id="plist"><div class="empty">No products yet. Tap Add Product.</div></div>
  </div>
</div>
<div class="modal" id="admM">
  <div class="mbox">
    <div class="mhd">Add Product <button id="admX">×</button></div>
    <div class="mbd"><div class="af">
      <div class="photo-preview" id="pPrev"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>
      <label>Photo</label><input type="file" id="pPhoto" accept="image/*">
      <label>Name</label><input id="pName" placeholder="Product name">
      <div class="row2"><div><label>Price (₹)</label><input id="pPrice" type="number" placeholder="0" min="0"></div><div><label>Stock qty</label><input id="pStock" type="number" placeholder="0" min="0"></div></div>
      <label>Category</label><select id="pCat"><option>General</option><option>Grocery</option><option>Electronics</option><option>Clothing</option></select>
      <label>Expiry date (optional)</label><input id="pExpiry" type="date">
      <button class="save" id="pSave">Save Product</button>
    </div></div>
  </div>
</div>
<div class="toast" id="toast"></div>
</div>
<script src="/static/common.js"></script>
<script>
let photoData=null;
async function refresh(){
  const list=await all('products'),total=list.length,out=list.filter(p=>(p.stock||0)<=0).length;
  const inv=list.reduce((a,p)=>a+(p.price||0)*Math.max(0,p.stock||0),0);
  $('#sTotal').textContent=total;$('#sIn').textContent=total-out;$('#sOut').textContent=out;$('#sVal').textContent=fmt(inv);
  const box=$('#plist');
  if(!list.length){box.innerHTML='<div class="empty">No products yet. Tap Add Product.</div>';return}
  list.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  box.innerHTML=list.map(p=>`<div class="pi" data-id="${p.id}"><div class="thumb">${productIcon(p)}</div><div class="info"><div class="name">${p.name}</div><div class="meta">${p.cat||'General'} · Stock ${p.stock||0}</div></div><div class="price">${fmt(p.price)}</div><button class="del" title="Delete">×</button></div>`).join('');
  $$('.pi .del').forEach(b=>b.onclick=async e=>{e.stopPropagation();if(!(await appConfirm('Delete','Delete this product?','Delete',true)))return;await del('products',+b.closest('.pi').dataset.id);toast('Product deleted');refresh()});
}
$('#btnAdd').onclick=()=>{photoData=null;$('#pPrev').innerHTML='<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>';$('#pPhoto').value='';$('#pName').value='';$('#pPrice').value='';$('#pStock').value='';$('#pExpiry').value='';$('#admM').classList.add('on')};
$('#admX').onclick=()=>$('#admM').classList.remove('on');
$('#pPhoto').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{photoData=ev.target.result;$('#pPrev').innerHTML=`<img src="${photoData}" alt="">`};r.readAsDataURL(f)};
$('#pSave').onclick=async()=>{const n=$('#pName').value.trim(),pr=+$('#pPrice').value,c=$('#pCat').value,st=+$('#pStock').value||0,ex=$('#pExpiry').value;if(!n||!(pr>=0))return toast('Name & price required');const data={name:n,price:pr,cat:c,stock:st,expiry:ex,color:COLORS[Math.floor(Math.random()*COLORS.length)]};if(photoData)data.photo=photoData;await put('products',data);toast('Product saved');$('#admM').classList.remove('on');refresh()};
$('#btnErase').onclick=async()=>{if(!(await appConfirm('Erase All Data','Erase all products, transactions and held bills? This cannot be undone.','Erase',true)))return;await clearStore('products');await clearStore('transactions');await clearStore('held');toast('All data erased');refresh()};
document.addEventListener('contextmenu',e=>e.preventDefault());
(async()=>{
  $('#drawerBody').innerHTML=adminMenu();
  initShell();
  await openDB();
  await refresh();
  // admin menu actions
  const closeDr=()=>{$('#dr').classList.remove('on');$('#ov').classList.remove('on')};
  $('#admOverview')&&($('#admOverview').onclick=()=>{closeDr();toast('Overview')});
  $('#admNotif')&&($('#admNotif').onclick=()=>{closeDr();toast('No new notifications')});
  $$('.adm-sub button').forEach(b=>b.onclick=async()=>{
    const a=b.dataset.act;closeDr();
    if(a==='add-product')$('#btnAdd').click();
    else if(a==='all-products'||a==='low-stock'){toast(a==='low-stock'?'Low stock list':'All products');window.scrollTo(0,0)}
    else if(a==='erase'){$('#btnErase').click()}
    else if(a==='panel'){location.href='/billing'}
    else toast('Coming soon');
  });
})();
</script>
</body>
</html>
